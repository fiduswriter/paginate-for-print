name: Deploy demos to Forgejo Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library bundles
        run: pnpm run build

      - name: Assemble site
        run: |
          rm -rf _pages
          mkdir -p _pages
          cp -r dist _pages/dist
          cp -r examples _pages/examples
          cp -r assets _pages/assets
          cp index.html _pages/index.html

      - name: Deploy to Pages branch
        run: |
          cd _pages
          git init
          git config user.name "CI"
          git config user.email "ci@fiduswriter.org"
          git add -A
          git commit -m "Deploy demo [skip ci]"
          git push -f "https://${{ secrets.PAGES_TOKEN }}@git.fiduswriter.org/${{ github.repository }}.git" HEAD:pages
