<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
  </match>
  <match target="font">
    <edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
  </match>
  <match target="font">
   <edit mode="assign" name="hinting"><bool>false</bool></edit>
  </match>

  <!-- The MS core fonts that spec fixtures reference (Times New Roman,
       Arial, Courier New) are installed in the image; no family aliasing
       is needed. Rasterization above is normalized for reproducible
       baselines. -->
</fontconfig>
