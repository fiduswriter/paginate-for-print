<!DOCTYPE html>
<html>
<head>
	<style>
		body {
			column-count: 2;
			column-gap: 12mm;
		}
		@page {
			size: 140mm 200mm;
			margin: 20mm;
		}
		p {
			line-height: 22px;
		}
		.break-after-column {
			break-after: column;
		}
	</style>
	<script src="../../../dist/paged.polyfill.js"></script>
</head>
<body>
	<p class="break-after-column first">First paragraph forces a column break after it.</p>
	<p class="second">Second paragraph should start in column two.</p>
</body>
</html>
