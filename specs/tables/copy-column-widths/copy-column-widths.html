<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <script src="../../../dist/paginate.polyfill.js"></script>
    <style>
table { border-collapse: collapse; width: 100%; }
td, th { border: 1px solid gray; }
th { background: gray; }
    </style>
  </head>

  <body>
    <table>
      <thead>
        <th>A</th>
        <th>B</th>
      </thead>

      <tbody>
        <script>
          // Make a table big enough so that the THEAD of the next table
          // should be split.
          for (var i = 1; i <= 38; i++) {
            document.write(`<tr><td>test ${i}</td><td>m2</td></tr>`);
          }
        </script>
      </tbody>
    </table>

    <table>
      <thead>
        <th>This table heading should be sit at the bottom of the page and want to be split. It should get moved onto the next page and repeated for the additional pages.</th>
        <th>B</th>
      </thead>

      <tbody>
        <script>
          // Make a table big enough so that the THEAD of the next table
          // should be split.
          for (var i = 1; i <= 100; i++) {
            document.write(`<tr><td>test ${i}</td><td>m2</td></tr>`);
          }
        </script>
      </tbody>
    </table>

    <!--
      The custom handler this fixture used to register, repeating the thead on
      every page, is gone: the paginator cuts tables itself and already repeats
      the header of a split table. Re-registering the old handler renders that
      header twice per page, so the tables above are left to the engine.
    -->
  </body>
</html>
