<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<title>target-counters spec</title>
	<script src="../../../dist/paged.polyfill.js"></script>
	<style>
		:root {
			font-size: 18px;
		}

		* {
			font-family: Times New Roman, sans-serif;
		}

		@page {
			size: 140mm 200mm;
			margin: 20mm;
		}

		section {
			counter-increment: section;
		}

		.toc {
			list-style: none;
			padding: 0;
		}

		.toc li {
			margin-bottom: 0.5em;
		}

		.toc a {
			text-decoration: none;
			color: inherit;
		}

		.toc a::after {
			content: target-counters(attr(href url), section, ".");
		}
	</style>
</head>

<body>
	<section>
		<h1 id="sec1">Section 1</h1>
		<section>
			<h2 id="sec1-1">Section 1.1</h2>
			<p>
				Lorem ipsum dolor sit amet, consectetur adipiscing elit. Morbi non suscipit odio. Aenean ut ligula id mauris efficitur tincidunt vitae non leo.
			</p>
		</section>
	</section>
	<ul class="toc">
		<li><a href="#sec1-1">Section 1.1</a></li>
	</ul>
</body>

</html>
